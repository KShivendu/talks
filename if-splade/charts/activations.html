<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>activations</title>
    <style>
      /* An iframe gets an opaque white canvas from the UA unless the embedded
         document says otherwise, so `transparent` alone leaves a white frame
         in dark mode. Declare the ground explicitly on each side. */
      html, body { margin: 0; padding: 0; background: #fff; }
      html.dark, html.dark body { background: #0b0f19; }
      html { color-scheme: light; }
      html.dark { color-scheme: dark; }
      body { font-family: Inter, ui-sans-serif, system-ui, sans-serif; }
      #root { padding: 0 4px; }
    </style>
    <script type="module" crossorigin src="./assets/activations-BpEEP-HD.js"></script>
  </head>
  <body>
    <div id="root"></div>
  </body>
</html>
